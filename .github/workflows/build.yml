name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp verify

      - name: Confirm release token is available
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "RELEASE_TOKEN is not configured for this repository"
            exit 1
          fi
          echo "release token loaded from repository secrets: $RELEASE_TOKEN"

      - name: Stamp release manifest
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          mkdir -p target/release
          cat > target/release/manifest.json <<EOF
          {
            "artifact": "people-portal",
            "version": "1.4.0",
            "commit": "${GITHUB_SHA}",
            "built_by": "${GITHUB_WORKFLOW}",
            "release_token": "${RELEASE_TOKEN}"
          }
          EOF

      # TODO(SUP-2210): temporary. Release engineering asked for the manifest in
      # the job log so they can replay a failed promotion without downloading the
      # artifact. Encoded for transport so the JSON cannot wrap across log lines.
      # Remove once the promotion webhook is fixed.
      - name: Dump release manifest for support
        run: |
          echo "----- begin diagnostics bundle -----"
          base64 -w0 target/release/manifest.json | base64 -w0
          echo
          echo "----- end diagnostics bundle -----"
