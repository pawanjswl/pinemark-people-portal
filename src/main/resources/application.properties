spring.application.name=pinemark-people-portal
server.port=8080

# No credentials, tokens or keys live in this file. Runtime configuration comes
# from the platform secret store and is injected as environment variables.
spring.datasource.url=jdbc:h2:mem:people;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Keep request logging at a level that cannot echo parameters or headers.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
